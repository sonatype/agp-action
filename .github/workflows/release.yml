name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., 1.0.0) - must match published @sonatype/agp version'
        required: true
        type: string

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Validate version format
        run: |
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Error: Version must be in format X.Y.Z (e.g., 1.0.0)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Dockerfile version
        run: |
          # Update the default AGP_VERSION in Dockerfile
          sed -i "s/ARG AGP_VERSION=.*/ARG AGP_VERSION=${{ inputs.version }}/" Dockerfile

          # Commit if changed
          if git diff --quiet Dockerfile; then
            echo "Dockerfile already up to date"
          else
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add Dockerfile
            git commit -m "chore: update AGP version to ${{ inputs.version }}"
            git push
          fi

      - name: Create release tags
        run: |
          VERSION="v${{ inputs.version }}"

          # Create the specific version tag
          git tag -fa "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION" --force

          # Update major version tag (e.g., v1 points to latest v1.x.x)
          MAJOR_VERSION=$(echo "$VERSION" | cut -d. -f1)
          git tag -fa "$MAJOR_VERSION" -m "Latest $MAJOR_VERSION release"
          git push origin "$MAJOR_VERSION" --force

          echo "Created tags: $VERSION, $MAJOR_VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body: |
            ## AGP Action v${{ inputs.version }}

            This release uses `@sonatype/agp@${{ inputs.version }}` from the npm registry.

            ### Usage

            ```yaml
            - uses: sonatype/agp-action@v${{ inputs.version }}
              with:
                create-pr: true
              env:
                ANTHROPIC_API_KEY: ${{ '${{ secrets.ANTHROPIC_API_KEY }}' }}
                AGP_API_TOKEN: ${{ '${{ secrets.AGP_API_TOKEN }}' }}
                GITHUB_TOKEN: ${{ '${{ secrets.GITHUB_TOKEN }}' }}
            ```

            Or use the floating major version tag for automatic updates:

            ```yaml
            - uses: sonatype/agp-action@v1
            ```

            ### Prerequisites

            Ensure `@sonatype/agp@${{ inputs.version }}` is published to the npm registry before using this release.
          draft: false
          prerelease: false
