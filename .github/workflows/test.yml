name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Action Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in action.yml gate/action.yml; do
            if [ ! -f "$f" ]; then
              echo "Error: $f not found"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate action.yml
        run: |
          # Check that action.yml is valid YAML
          python3 -c "import yaml; yaml.safe_load(open('action.yml'))"
          echo "action.yml is valid YAML"

      - name: Validate gate/action.yml
        run: |
          # Check that the gate composite action is valid YAML
          python3 -c "import yaml; yaml.safe_load(open('gate/action.yml'))"
          echo "gate/action.yml is valid YAML"

      - name: Shellcheck scripts/*.sh
        run: |
          # shellcheck is preinstalled on ubuntu-latest runners; the explicit
          # version check keeps the step honest if the image ever changes.
          shellcheck --version
          shellcheck scripts/*.sh
