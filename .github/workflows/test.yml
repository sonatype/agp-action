name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Action Files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          for f in action.yml gate/action.yml; do
            if [ ! -f "$f" ]; then
              echo "Error: $f not found"
              exit 1
            fi
          done
          echo "All required files present"

      - name: Validate action YAML
        run: |
          python3 - <<'PY'
          import re, sys, yaml
          ok = True
          for f in ("action.yml", "gate/action.yml"):
              m = yaml.safe_load(open(f))
              if not isinstance(m, dict) or "runs" not in m:
                  print(f"{f}: missing top-level 'runs'"); ok = False; continue
              step_ids = {
                  s["id"]
                  for s in (m["runs"].get("steps") or [])
                  if isinstance(s, dict) and s.get("id")
              }
              # Every outputs.<id>.value that references steps.<sid>.outputs must point at
              # a step id that actually exists, so renaming an inner step id can't silently
              # break consumers of this action.
              for oid, ospec in (m.get("outputs") or {}).items():
                  value = str((ospec or {}).get("value", ""))
                  for sid in re.findall(r"steps\.([A-Za-z0-9_-]+)\.outputs", value):
                      if sid not in step_ids:
                          print(f"{f}: output '{oid}' references unknown step id '{sid}'")
                          ok = False
              print(f"{f} is valid (YAML + output references)")
          sys.exit(0 if ok else 1)
          PY

      - name: Shellcheck scripts/*.sh
        run: |
          # shellcheck is preinstalled on ubuntu-latest runners; the explicit
          # version check keeps the step honest if the image ever changes.
          shellcheck --version
          shellcheck scripts/*.sh

      - name: Test gate directive parsing
        run: |
          bash scripts/gate_test.sh

      - name: Test prepare-auth classified-error parsing
        run: |
          bash scripts/prepare-auth_test.sh

      - name: Test governed Bedrock role resolution
        run: |
          bash scripts/resolve-bedrock-role_test.sh
