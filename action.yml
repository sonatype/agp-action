name: "AGP - Agentic Patches"
description: "AI-powered dependency upgrades for npm projects using pre-built Docker image"
author: "Sonatype"

branding:
  icon: "package"
  color: "blue"

inputs:
  mode:
    description: "Run mode: 'full' (all updates), 'security' (only vulnerable packages), or 'heal' (rebuild conflicting PRs)"
    required: false
    default: "full"
  repo_id:
    description: "Sonatype Guide repository id (required when mode=heal)"
    required: false
    default: ""
  vulnerabilities:
    description: "JSON array of vulnerabilities to fix (for security mode, typically provided by Guide via workflow_dispatch)"
    required: false
    default: ""
  working-directory:
    description: "Directory containing package.json"
    required: false
    default: "."
  node-version:
    description: "Node.js version to use (20 or 22)"
    required: false
    default: "22"
  create-pr:
    description: "Create GitHub PRs for upgrades"
    required: false
    default: "false"
  draft-pr:
    description: "Create PRs as drafts"
    required: false
    default: "false"
  enable-agent:
    description: "Enable AI agent for fixing validation failures"
    required: false
    default: "true"
  max-fix-attempts:
    description: "Maximum AI fix attempts per group"
    required: false
    default: "3"
  dry-run:
    description: "Preview changes without applying them"
    required: false
    default: "false"
  group:
    description: "Apply only a specific group by ID"
    required: false
    default: ""
  validation-commands:
    description: "Commands to validate upgrades (newline-separated)"
    required: false
    default: ""
  npmrc-content:
    description: ".npmrc file content for private registry authentication"
    required: false
    default: ""
  maven-settings-xml:
    description: "Maven settings.xml content for private repository authentication"
    required: false
    default: ""
  verbose:
    description: "Enable verbose output (may expose sensitive data in logs)"
    required: false
    default: "false"
  # --------------------------------------------------------------------------
  # Authentication for pushing commits and opening PRs
  #
  # By default the action mints a short-lived GitHub App installation access
  # token for the Sonatype Guide App via Sonatype Guide's OIDC token broker
  # (https://api.guide.sonatype.com/agp/installation-token). The resulting
  # token produces PRs authored by sonatype-guide[bot] with the Verified bot
  # badge on commits. The Sonatype Guide App must be installed on the target
  # repository, and the job must declare `permissions: id-token: write`.
  #
  # To opt out of the broker (air-gapped runners, GHES without OIDC, CI
  # debugging), set `github-token` to a PAT or GITHUB_TOKEN from the workflow.
  # In that case PRs will be authored by whoever owns the supplied token.
  # --------------------------------------------------------------------------
  github-token:
    description: "Override for the token used to push commits and open PRs. When unset, the action mints one from the Sonatype Guide OIDC broker so PRs open as sonatype-guide[bot]."
    required: false
    default: ""
  git-user-name:
    description: "Git user name for commits. Leave blank to match the authenticating identity (sonatype-guide[bot] when the broker is used)."
    required: false
    default: ""
  git-user-email:
    description: "Git user email for commits. Leave blank to match the authenticating identity — e.g. <user-id>+sonatype-guide[bot]@users.noreply.github.com, which is required for GitHub to show the Verified bot badge on commits."
    required: false
    default: ""
  # Docker image configuration
  docker-image:
    description: "Fully-qualified Docker image path including registry and tag. Defaults to the public Docker Hub image sonatype/agp:latest (no authentication required). To use a private registry, override this and supply docker-username/docker-password."
    required: false
    default: "sonatype/agp:latest"
  docker-username:
    description: "Docker registry username. When provided with docker-password, the action logs into the registry extracted from docker-image before pulling. Leave unset for the public default image."
    required: false
    default: ""
  docker-password:
    description: "Docker registry password. When provided with docker-username, the action logs into the registry extracted from docker-image before pulling. Leave unset for the public default image."
    required: false
    default: ""
  skip-docker-pull:
    description: "Skip pulling the Docker image (for local testing with pre-built images)"
    required: false
    default: "false"
  mount-docker-socket:
    description: "Mount the host Docker socket into the AGP container, enabling Docker commands and container-based tools (e.g., Testcontainers, Docker Compose) during setup and validation"
    required: false
    default: "false"

outputs:
  run-id:
    description: "AGP run tracking ID"
    value: ${{ steps.parse-outputs.outputs.run-id }}
  groups-upgraded:
    description: "Number of groups successfully upgraded"
    value: ${{ steps.parse-outputs.outputs.groups-upgraded }}
  groups-failed:
    description: "Number of groups that failed"
    value: ${{ steps.parse-outputs.outputs.groups-failed }}
  pr-urls:
    description: "JSON array of created PR URLs"
    value: ${{ steps.parse-outputs.outputs.pr-urls }}

runs:
  using: "composite"
  steps:
    # Optional: Login to Docker registry if credentials provided
    - name: Extract registry from docker-image
      id: extract-registry
      if: ${{ inputs.docker-username != '' && inputs.docker-password != '' }}
      shell: bash
      run: |
        IMAGE="${{ inputs.docker-image }}"
        # Extract registry hostname (everything before the first /)
        # e.g. "sonatype.repo.sonatype.app/docker-all/sonatype/agp:latest" -> "sonatype.repo.sonatype.app"
        REGISTRY=$(echo "${IMAGE}" | cut -d'/' -f1)
        # If it doesn't contain a dot, it's a Docker Hub path — no explicit registry needed
        if [[ "${REGISTRY}" != *.* ]]; then
          REGISTRY=""
        fi
        echo "registry=${REGISTRY}" >> $GITHUB_OUTPUT

    - name: Login to Docker Registry
      if: ${{ inputs.docker-username != '' && inputs.docker-password != '' }}
      uses: docker/login-action@v3
      with:
        registry: ${{ steps.extract-registry.outputs.registry }}
        username: ${{ inputs.docker-username }}
        password: ${{ inputs.docker-password }}

    # Acquire the token and commit identity used for git push and PR creation.
    #
    # Default path: exchange the GitHub Actions OIDC JWT for a short-lived
    # GitHub App installation token via Sonatype Guide's broker. The token is
    # scoped to the current repo with contents:write + pull_requests:write
    # and produces PRs authored by sonatype-guide[bot] with the Verified bot
    # badge on commits. Requires `permissions: id-token: write` on the job.
    #
    # Override path: `github-token` input. Used for air-gapped runners, GHES
    # without OIDC federation, or local debugging. PRs in that case are
    # authored by whoever owns the supplied token.
    - name: Prepare GitHub authentication
      id: prepare-auth
      shell: bash
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
      run: |
        bash "${{ github.action_path }}/scripts/prepare-auth.sh"

    # Run AGP using pre-built Docker image (includes gh CLI)
    - name: Run AGP
      id: run-agp
      if: ${{ inputs.mode != 'security' || inputs.vulnerabilities != '' }}
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ env.ANTHROPIC_API_KEY }}
        AGP_API_TOKEN: ${{ env.AGP_API_TOKEN }}
        AGP_API_URL: ${{ env.AGP_API_URL }}
        GITHUB_TOKEN: ${{ steps.prepare-auth.outputs.token }}
        INPUT_MODE: ${{ inputs.mode }}
        INPUT_REPO_ID: ${{ inputs.repo_id }}
        INPUT_VULNERABILITIES: ${{ inputs.vulnerabilities }}
        INPUT_WORKING_DIRECTORY: ${{ inputs.working-directory }}
        INPUT_NODE_VERSION: ${{ inputs.node-version }}
        INPUT_CREATE_PR: ${{ inputs.create-pr }}
        INPUT_DRAFT_PR: ${{ inputs.draft-pr }}
        INPUT_ENABLE_AGENT: ${{ inputs.enable-agent }}
        INPUT_MAX_FIX_ATTEMPTS: ${{ inputs.max-fix-attempts }}
        INPUT_DRY_RUN: ${{ inputs.dry-run }}
        INPUT_GROUP: ${{ inputs.group }}
        INPUT_VALIDATION_COMMANDS: ${{ inputs.validation-commands }}
        INPUT_NPMRC_CONTENT: ${{ inputs.npmrc-content }}
        INPUT_MAVEN_SETTINGS_XML: ${{ inputs.maven-settings-xml }}
        ANTHROPIC_BASE_URL: ${{ env.ANTHROPIC_BASE_URL }}
        INPUT_VERBOSE: ${{ inputs.verbose }}
        INPUT_GIT_USER_NAME: ${{ steps.prepare-auth.outputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ steps.prepare-auth.outputs.git-user-email }}
      run: |
        IMAGE="${{ inputs.docker-image }}"
        echo "📦 Using AGP Docker image: ${IMAGE}"
        if [ "${{ inputs.skip-docker-pull }}" = "true" ]; then
          echo "ℹ️ Skipping docker pull (skip-docker-pull=true)"
        else
          docker pull "${IMAGE}"
        fi

        # Use vulnerabilities input for security mode
        VULN_PACKAGES=""
        if [ "$INPUT_MODE" = "security" ] && [ -n "$INPUT_VULNERABILITIES" ]; then
          VULN_PACKAGES="$INPUT_VULNERABILITIES"
          echo "🔒 Security mode: passing $(echo "$VULN_PACKAGES" | jq 'length') vulnerable packages to CLI"
        else
          echo "DEBUG: Security mode check failed - mode='$INPUT_MODE', has_vulns=$([ -n "$INPUT_VULNERABILITIES" ] && echo 'yes' || echo 'no')"
        fi

        # Debug: show what inputs we received
        echo "DEBUG: INPUT_MODE='$INPUT_MODE'"
        echo "DEBUG: INPUT_VULNERABILITIES length=$(echo "$INPUT_VULNERABILITIES" | wc -c)"
        if [ -n "$INPUT_VULNERABILITIES" ]; then
          echo "DEBUG: INPUT_VULNERABILITIES first 200 chars: ${INPUT_VULNERABILITIES:0:200}"
        fi

        # Create Maven settings.xml if provided
        MVN_SETTINGS_MOUNT=""
        MVN_SETTINGS_ENV=""
        if [ -n "$INPUT_MAVEN_SETTINGS_XML" ]; then
          MAVEN_SETTINGS_PATH="${RUNNER_TEMP}/maven-settings.xml"
          printf '%s\n' "$INPUT_MAVEN_SETTINGS_XML" > "$MAVEN_SETTINGS_PATH"
          # Use 644 instead of 600 so the agp user (uid 10000) inside Docker can read it
          chmod 644 "$MAVEN_SETTINGS_PATH"
          echo "📦 Created Maven settings.xml for private repository authentication"
          MVN_SETTINGS_MOUNT="-v ${MAVEN_SETTINGS_PATH}:/home/agp/.m2/settings.xml:ro"
          MVN_SETTINGS_ENV="-e MVN_SETTINGS=/home/agp/.m2/settings.xml"
        fi

        # Mount Docker socket if requested (for Testcontainers, Docker Compose, etc.)
        DOCKER_SOCKET_OPTS=""
        if [ "${{ inputs.mount-docker-socket }}" = "true" ]; then
          if [ -S /var/run/docker.sock ]; then
            DOCKER_GID=$(stat -c '%g' /var/run/docker.sock 2>/dev/null || echo "")
            DOCKER_SOCKET_OPTS="-v /var/run/docker.sock:/var/run/docker.sock"
            if [ -n "$DOCKER_GID" ]; then
              DOCKER_SOCKET_OPTS="$DOCKER_SOCKET_OPTS --group-add ${DOCKER_GID}"
            fi
            DOCKER_SOCKET_OPTS="$DOCKER_SOCKET_OPTS -e DOCKER_HOST=unix:///var/run/docker.sock"
            DOCKER_SOCKET_OPTS="$DOCKER_SOCKET_OPTS -e TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE=/var/run/docker.sock"
            echo "🐳 Docker socket will be mounted into AGP container (gid=${DOCKER_GID})"
            if [ -f "$HOME/.docker/config.json" ]; then
              DOCKER_SOCKET_OPTS="$DOCKER_SOCKET_OPTS -v $HOME/.docker/config.json:/home/agp/.docker/config.json:ro"
              echo "🔑 Docker config forwarded for registry authentication"
            fi
          else
            echo "⚠️ mount-docker-socket=true but /var/run/docker.sock not found — skipping"
          fi
        fi

        # Mount npmrc as file if content provided (same pattern as Maven settings)
        NPMRC_MOUNT=""
        if [ -n "$INPUT_NPMRC_CONTENT" ]; then
          NPMRC_PATH="${RUNNER_TEMP}/npmrc"
          printf '%s\n' "$INPUT_NPMRC_CONTENT" > "$NPMRC_PATH"
          chmod 644 "$NPMRC_PATH"
          NPMRC_MOUNT="-v ${NPMRC_PATH}:/home/agp/.npmrc:ro"
          echo "📦 npmrc mounted for private registry authentication"
        fi

        # Run AGP container (gh CLI included in image)
        # Note: We add git safe.directory config to handle GitHub Actions checkout
        # shellcheck disable=SC2086
        docker run --rm \
          -v "${{ github.workspace }}:/github/workspace" \
          ${MVN_SETTINGS_MOUNT} \
          ${DOCKER_SOCKET_OPTS} \
          ${NPMRC_MOUNT} \
          -w /github/workspace \
          -e GIT_CONFIG_COUNT=1 \
          -e GIT_CONFIG_KEY_0=safe.directory \
          -e GIT_CONFIG_VALUE_0=/github/workspace \
          -e ANTHROPIC_API_KEY \
          -e ANTHROPIC_BASE_URL \
          -e AGP_API_TOKEN \
          -e AGP_API_URL \
          -e GITHUB_TOKEN \
          -e GH_TOKEN="${{ env.GITHUB_TOKEN }}" \
          -e GITHUB_REPOSITORY="${{ github.repository }}" \
          -e GITHUB_ACTIONS=true \
          -e ACTIONS_ID_TOKEN_REQUEST_URL \
          -e ACTIONS_ID_TOKEN_REQUEST_TOKEN \
          -e GH_DEBUG=api \
          -e AWS_ACCESS_KEY_ID \
          -e AWS_SECRET_ACCESS_KEY \
          -e AWS_SESSION_TOKEN \
          -e AWS_REGION \
          -e AWS_DEFAULT_REGION \
          -e GIT_AUTHOR_NAME="${{ steps.prepare-auth.outputs.git-user-name }}" \
          -e GIT_AUTHOR_EMAIL="${{ steps.prepare-auth.outputs.git-user-email }}" \
          -e GIT_COMMITTER_NAME="${{ steps.prepare-auth.outputs.git-user-name }}" \
          -e GIT_COMMITTER_EMAIL="${{ steps.prepare-auth.outputs.git-user-email }}" \
          -e GITHUB_OUTPUT=/tmp/github_output \
          -e INPUT_MODE \
          -e INPUT_REPO_ID \
          -e INPUT_VULNERABLE_PACKAGES="$VULN_PACKAGES" \
          -e INPUT_WORKING_DIRECTORY \
          -e INPUT_NODE_VERSION \
          -e INPUT_CREATE_PR \
          -e INPUT_DRAFT_PR \
          -e INPUT_ENABLE_AGENT \
          -e INPUT_MAX_FIX_ATTEMPTS \
          -e INPUT_DRY_RUN \
          -e INPUT_GROUP \
          -e INPUT_VALIDATION_COMMANDS \
          -e INPUT_NPMRC_CONTENT \
          -e INPUT_VERBOSE \
          -e INPUT_GIT_USER_NAME \
          -e INPUT_GIT_USER_EMAIL \
          ${MVN_SETTINGS_ENV} \
          "${IMAGE}"

    # Parse outputs from AGP run (if any)
    - name: Parse Outputs
      id: parse-outputs
      shell: bash
      run: |
        # Placeholder for output parsing
        # In the future, AGP will write outputs to GITHUB_OUTPUT
        echo "run-id=" >> $GITHUB_OUTPUT
        echo "groups-upgraded=" >> $GITHUB_OUTPUT
        echo "groups-failed=" >> $GITHUB_OUTPUT
        echo "pr-urls=" >> $GITHUB_OUTPUT
