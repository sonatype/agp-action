# Sonatype Guide — Agent P Gate (sonatype/agp-action/gate)
#
# A lightweight, Docker-free gate that fetches the governed effective agp.yml from
# Sonatype Guide over GitHub OIDC, writes it to the workspace, and reports a run/pause
# directive. Pairs with the two-job workflow so a paused (or fail-closed) repository
# skips the heavy agp job entirely — no runner image pull.
#
# Auth shares scripts/mint-oidc-token.sh with scripts/prepare-auth.sh: it mints a GitHub
# OIDC token for the configured audience (default https://guide.sonatype.com) and calls
# the Guide API (AGP_API_URL, default https://api.guide.sonatype.com). Fail-closed: the
# download is staged outside the workspace and only moved into place after a verified
# HTTP 200 + workspace-containment check, so a committed agp.yml is left intact on any
# failure and replaced atomically on success — a run never proceeds against a stale agp.yml.
#
# Because configuration is governed centrally in the Guide dashboard, the written file is not
# meant to live in the customer's repository: the gate also marks it git-excluded locally (an
# anchored entry in the repo's .git/info/exclude, which is repo-local and never versioned) so it
# never appears as a pending change and cannot trip the AGP CLI's clean-worktree pre-flight guard
# ("Uncommitted changes in working directory"). Best-effort bookkeeping: if git is
# unavailable it only warns. A config file that is still COMMITTED cannot be hidden this way, so
# the gate warns and asks for it to be untracked (git rm --cached).

name: "Sonatype Guide Agent P Gate"
description: "Fetch the governed effective agp.yml over OIDC and emit a run/pause directive (fail-closed)."
author: "Sonatype"

inputs:
  guide-url:
    # Empty by default: the effective default ($AGP_API_URL, then the prod API) is resolved
    # in scripts/gate.sh, not here, so the YAML manifest declares "" rather than a literal URL.
    description: "Base URL of the Sonatype Guide API. Leave empty to use $AGP_API_URL, then the production API (resolution happens in scripts/gate.sh)."
    required: false
    default: ""
  audience:
    # Canonical default mirrors DEFAULT_GUIDE_AUDIENCE in scripts/mint-oidc-token.sh;
    # keep the two in sync.
    description: "OIDC audience expected by Sonatype Guide. Leave at the default unless Sonatype Support instructs otherwise."
    required: false
    default: "https://guide.sonatype.com"
  config-path:
    description: "Where to write the rendered agp.yml. Must be a relative path inside the workspace; absolute paths, '..' segments, control characters, and paths that resolve outside $GITHUB_WORKSPACE via symlinks are rejected (fail-closed). The gate marks the written file as git-excluded locally (.git/info/exclude) so it never shows up as a pending change; if this file is still committed to the repo, untrack it — configuration is governed centrally in Sonatype Guide and re-fetched every run."
    required: false
    default: "agp.yml"

outputs:
  directive:
    description: "run | paused — whether the dependent agp job should proceed."
    value: ${{ steps.gate.outputs.directive }}

runs:
  using: "composite"
  steps:
    - id: gate
      shell: bash
      # Security: never interpolate ${{ inputs.* }} / ${{ github.* }} directly inside run;
      # pass them through env and reference $VARS so untrusted values cannot inject shell.
      env:
        GUIDE_URL_INPUT: ${{ inputs.guide-url }}
        OIDC_AUDIENCE: ${{ inputs.audience }}
        CONFIG_PATH: ${{ inputs.config-path }}
        ACTION_PATH: ${{ github.action_path }}
      # The gate logic lives in scripts/gate.sh so it is covered by `shellcheck scripts/*.sh`
      # and unit-tested by scripts/gate_test.sh. Inputs are passed via env (never interpolated
      # into run) so untrusted values cannot inject shell.
      #
      # The `../scripts/` traversal is deliberate: the gate is shipped as a subdirectory of
      # sonatype/agp-action (so the gate and the Docker action version in lockstep — one repo,
      # one tag), and ${{ github.action_path }} points at gate/, so the shared scripts live one
      # level up. The gate/ subtree is therefore not independently extractable without scripts/.
      run: |
        bash "${ACTION_PATH}/../scripts/gate.sh"
